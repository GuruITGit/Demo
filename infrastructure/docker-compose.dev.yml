version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartgov_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartgov_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartgov_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartgov_dev_net

  redis:
    image: redis:7-alpine
    container_name: smartgov_redis_dev
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - smartgov_dev_net

  minio:
    image: minio/minio:latest
    container_name: smartgov_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_dev_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - smartgov_dev_net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: smartgov_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - smartgov_dev_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartgov_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@smartgov.local
      PGADMIN_DEFAULT_PASSWORD: devpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - smartgov_dev_net

volumes:
  postgres_dev_data:
  minio_dev_data:

networks:
  smartgov_dev_net:
    driver: bridge
