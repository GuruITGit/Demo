worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 100M;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # ── IP จริงของผู้ใช้ เมื่อมาทาง Cloudflare (Tunnel หรือ proxy) ──
  # ไม่ตั้งอันนี้ = ทุก request จะเป็น IP ของ cloudflared/Cloudflare ตัวเดียวกันหมด ทำให้
  #   1) rate limit ข้างล่าง + @Throttle ฝั่งประชาชน นับรวมทุกคน → ชาวบ้านคนที่ 9 ของนาทีนั้นโดนบล็อก
  #   2) ประวัติล็อกอิน/กิจกรรม บันทึก IP ของ Cloudflare หมด สืบย้อนไม่ได้
  # cloudflared วิ่งใน docker network เดียวกัน จึงเชื่อ private range ได้ (ไม่มีใครนอกเครื่องปลอม header เข้ามาได้)
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  # Resolve ชื่อ container ผ่าน Docker DNS ทุก 10 วิ — ห้ามใช้ upstream แบบ static
  # (nginx จะ cache IP ตอนบูต พอ container ถูกสร้างใหม่/IP ขยับหลัง deploy จะ 502 จนกว่าจะ restart nginx)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # HTTP -> HTTPS redirect
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS
  server {
    listen 443 ssl http2;
    server_name _;

    # proxy_pass ผ่านตัวแปร = บังคับ nginx resolve DNS ใหม่ตาม resolver ด้านบน
    set $backend_upstream http://backend:4000;
    set $frontend_upstream http://frontend:3000;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' wss: https://cloudflareinsights.com; frame-src 'self' https://www.openstreetmap.org; frame-ancestors 'self';" always;

    # API
    location /v1/ {
      limit_req zone=api_limit burst=20 nodelay;

      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Auth endpoints — stricter rate limit
    location /v1/auth/login {
      limit_req zone=auth_limit burst=5 nodelay;

      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (socket.io) — gateway ใช้ namespace '/ws' แต่ transport path คือ /socket.io/ (ค่าเริ่มต้น)
    # frontend ต่อ same-origin ผ่าน nginx จึงต้อง route /socket.io/ ไป backend (ไม่งั้นตกไป location / = frontend)
    location /socket.io/ {
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # หมายเหตุ: ไม่ proxy ไป MinIO ตรง ๆ — ไฟล์ทั้งหมดเสิร์ฟผ่าน backend ที่ /v1/storage/files/...
    # (รองรับทั้งโหมด MinIO และ filesystem) จึงไม่อ้าง host "minio" เพื่อให้ใช้กับ lean stack ที่ไม่มี minio ได้

    # Health check
    location /health {
      proxy_pass $backend_upstream/v1/health;
      access_log off;
    }

    # Frontend (Next.js) — ทุก path ที่เหลือส่งเข้าหน้าเว็บ
    location / {
      proxy_pass $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
