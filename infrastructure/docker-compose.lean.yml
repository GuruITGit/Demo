# SmartGov — Lean stack (ตัด redis/minio ที่โค้ดไม่ได้ใช้จริง) เหมาะกับ 2 core / 4GB RAM
#
# ตัดออกจาก docker-compose.yml ตัวเต็ม:
#   - redis  : โค้ดไม่ได้ใช้จริง (Cache = in-memory, Throttler = in-memory)
#   - minio  : ใช้ filesystem storage แทน (โค้ด fallback ลงดิสก์ที่ /app/.storage อัตโนมัติ)
#
# จูน postgres ไว้สำหรับ ~4GB RAM — เครื่องเล็กกว่านี้ (2GB) ลด shared_buffers เหลือ 128MB
# วิธีใช้:  docker compose -f docker-compose.lean.yml up -d
# (ไฟล์นี้ standalone ไม่ต้องรวมกับ docker-compose.yml)

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartgov_postgres
    restart: unless-stopped
    # จูนให้กิน RAM น้อยลงสำหรับเครื่อง 2GB
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=50
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
    environment:
      POSTGRES_DB: ${DB_NAME:-smartgov}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-S3cur3P@ssw0rd}
      PGDATA: /var/lib/postgresql/data/pgdata
      # เวลาไทยทั้งระบบ — ไม่งั้น CURRENT_DATE/EXTRACT ตัดวันตาม UTC (เกินกำหนด/ลาวันนี้/รายงานเดือนเพี้ยนช่วง 00:00-06:59 น.)
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smartgov}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartgov_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: smartgov_backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      TZ: Asia/Bangkok
      # ไม่มี minio → storage.service จะ fallback ไป filesystem (/app/.storage) อัตโนมัติ
      NODE_OPTIONS: "--max-old-space-size=512"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_storage:/app/.storage      # ไฟล์แนบทั้งหมด (โหมด filesystem) — อย่าลบ
    networks:
      - smartgov_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/v1}    container_name: smartgov_frontend
    restart: unless-stopped
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
      # ชื่อแท็บ/ไอคอนเว็บดึงชื่อ+โลโก้ อบต. ตามโดเมนจาก backend ฝั่ง server (NEXT_PUBLIC_API_URL='/v1' ใช้ฝั่ง server ไม่ได้)
      INTERNAL_API_URL: http://backend:4000/v1
    depends_on:
      - backend
    networks:
      - smartgov_net
    healthcheck:
      # หน้า / redirect 307 → /citizen ทำให้ wget รายงาน unhealthy → ใช้ node เช็คแทน (ยอมรับ <500)
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # สำรองข้อมูลอัตโนมัติทุกคืน (DB + ไฟล์แนบ) → ./backups บนเครื่อง host
  # รันมือ: docker compose -f docker-compose.lean.yml exec backup sh /backup.sh once
  backup:
    image: postgres:16-alpine
    container_name: smartgov_backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASS:-S3cur3P@ssw0rd}
      PGDATABASE: ${DB_NAME:-smartgov}
      TZ: Asia/Bangkok
      BACKUP_TIME: "02:30"        # เวลาไทย
      BACKUP_KEEP_DAYS: "14"      # เก็บย้อนหลังกี่วัน
    volumes:
      - ./backups:/backups
      - ./backup/backup.sh:/backup.sh:ro
      - backend_storage:/data/storage:ro
      - backend_uploads:/data/uploads:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartgov_net

  nginx:
    image: nginx:alpine
    container_name: smartgov_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - smartgov_net

  # Cloudflare Tunnel — เซิร์ฟเวอร์ "ต่อออก" ไปหา Cloudflare แทนการเปิดพอร์ตขาเข้า
  # จำเป็นเพราะ NAT/firewall ของ INET ปล่อยพอร์ต 443 ขาเข้าจาก Cloudflare ไม่ผ่าน (ยืนยันด้วย tcpdump 31/07/2569)
  # ตั้ง TUNNEL_TOKEN ใน infrastructure/.env แล้วชี้ public hostname ใน dashboard มาที่ https://nginx:443 (No TLS Verify)
  # ถ้ายังไม่ได้ตั้ง token → compose จะไม่สตาร์ท service นี้ (ใช้ profile)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smartgov_cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - smartgov_net

volumes:
  postgres_data:
  backend_uploads:
  backend_storage:

networks:
  smartgov_net:
    driver: bridge
