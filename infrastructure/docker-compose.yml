version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartgov_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartgov}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-S3cur3P@ssw0rd}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smartgov}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartgov_net

  redis:
    image: redis:7-alpine
    container_name: smartgov_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-R3d1sP@ss} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-R3d1sP@ss}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartgov_net

  # ── MinIO ถูกถอดออก 05/09/2569 ──────────────────────────────────────────────
  # เหตุผล: บน prod ตอบ SignatureDoesNotMatch (รหัสไม่ตรง) มาตลอด → ไม่เคยเก็บไฟล์ได้จริงสักไฟล์
  # (bucket ว่างเปล่า) ระบบจึง fallback ไป filesystem เงียบ ๆ แต่ตอนนั้น /app/.storage ไม่ได้ mount
  # volume → ไฟล์ที่อัปโหลดหายทุกครั้งที่สร้างคอนเทนเนอร์ใหม่
  # ตอนนี้ใช้ filesystem ตรง ๆ (STORAGE_DRIVER=fs + volume backend_storage) ซึ่งเบากว่าและ backup ครอบคลุมแล้ว
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: smartgov_backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      REDIS_HOST: redis
      # เก็บไฟล์บนดิสก์อย่างเดียว (ระบุชัด ไม่ให้สลับโหมดเอง) — MinIO ถูกถอดออกแล้ว
      STORAGE_DRIVER: fs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      # ⚠️ ห้ามลบ — ไฟล์แนบ/รูป/โลโก้ทั้งหมดอยู่ในนี้ (ถ้าไม่ mount ไฟล์จะหายทุกครั้งที่ deploy)
      - backend_storage:/app/.storage
    networks:
      - smartgov_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
      args:
        # โดเมนเดียวกัน ยิง API ผ่าน nginx → ใช้ relative '/v1' ได้เลย (ไม่ต้อง rebuild ตอนเปลี่ยนโดเมน)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/v1}    container_name: smartgov_frontend
    restart: unless-stopped
    environment:
      # ชื่อแท็บ/ไอคอนเว็บดึงชื่อ+โลโก้ อบต. ตามโดเมนจาก backend ฝั่ง server (NEXT_PUBLIC_API_URL='/v1' ใช้ฝั่ง server ไม่ได้)
      INTERNAL_API_URL: http://backend:4000/v1
    depends_on:
      - backend
    networks:
      - smartgov_net
    healthcheck:
      # หน้า / redirect 307 → /citizen ทำให้ wget รายงาน unhealthy → ใช้ node เช็คแทน (ยอมรับ <500)
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: smartgov_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - smartgov_net

  # Cloudflare Tunnel — เซิร์ฟเวอร์ "ต่อออก" ไปหา Cloudflare แทนการเปิดพอร์ตขาเข้า
  # จำเป็นเพราะ NAT/firewall ของ INET ปล่อยพอร์ต 443 ขาเข้าจาก Cloudflare ไม่ผ่าน (ยืนยันด้วย tcpdump 31/07/2569)
  # ตั้ง TUNNEL_TOKEN ใน infrastructure/.env แล้วชี้ public hostname ใน dashboard มาที่ https://nginx:443 (No TLS Verify)
  # ถ้ายังไม่ได้ตั้ง token → compose จะไม่สตาร์ท service นี้ (ใช้ profile)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smartgov_cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - smartgov_net

  # สำรองข้อมูลอัตโนมัติทุกคืน → ./backups (db-*.dump + files-*.tar.gz, เก็บ 14 วัน)
  # เดิมรันเป็น container ลอย (orphan) เพราะคอมโพสหลักไม่มี service นี้ — ถ้าเผลอ `docker compose down`
  # ระบบสำรองจะหายไปเงียบ ๆ จึงย้ายเข้ามาให้คอมโพสดูแลจริง (mount ตรงกับของเดิมทุกจุด)
  backup:
    image: postgres:16-alpine
    container_name: smartgov_backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASS:-S3cur3P@ssw0rd}
      PGDATABASE: ${DB_NAME:-smartgov}
      TZ: Asia/Bangkok
      BACKUP_TIME: "02:30"        # เวลาไทย
      BACKUP_KEEP_DAYS: "14"      # เก็บย้อนหลังกี่วัน
    volumes:
      - ./backups:/backups
      - ./backup/backup.sh:/backup.sh:ro
      - backend_storage:/data/storage:ro
      - backend_uploads:/data/uploads:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartgov_net

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  # ไฟล์แนบ/รูป/โลโก้ทั้งหมด (โหมด filesystem) — backup service สำรองจาก volume นี้
  backend_storage:

networks:
  smartgov_net:
    driver: bridge
