services:
  - type: web
    name: smartgov-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: APP_URL
        fromService:
          type: web
          name: smartgov-backend
          property: host
      # ⚠️ ใช้ Supabase "Session Pooler" ไม่ใช่ direct connection
      #   - direct (db.<ref>.supabase.co:5432) เป็น IPv6-only → Render free ต่อไม่ได้
      #   - pooler host: aws-0-<region>.pooler.supabase.com  พอร์ต 5432 (session)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      # pooler ใช้ username แบบ postgres.<project-ref>
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres
      # Supabase บังคับ SSL
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
